name: Ariome CI/CD

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy on EC2
        run: |
          set -euo pipefail
          APP_DIR=/home/ec2-user/Ariome-backend

          cd "$APP_DIR"
          git fetch origin main
          git reset --hard origin/main
          npm ci --omit=dev

          if pm2 describe ariome-backend >/dev/null 2>&1; then
            pm2 restart ariome-backend --update-env
          else
            pm2 start server.js --name ariome-backend
          fi

          pm2 save
          pm2 status